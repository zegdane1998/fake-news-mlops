stages:

  download_pheme:
    cmd: python src/download_pheme.py
    deps:
      - src/download_pheme.py
    outs:
      - data/raw/pheme_tweets.csv

  preprocess_pheme:
    cmd: >
      python src/preprocessing.py
      --input  data/raw/pheme_tweets.csv
      --output data/processed/pheme_cleaned.csv
      --mode   tweet
    deps:
      - data/raw/pheme_tweets.csv
      - src/preprocessing.py
    outs:
      - data/processed/pheme_cleaned.csv

  baselines_pheme:
    cmd: python src/baselines.py
    deps:
      - data/processed/pheme_cleaned.csv
      - src/baselines.py
    outs:
      - models/tfidf_logreg.pkl
      - models/tfidf_svm.pkl
      - models/lstm_pheme.pt
      - models/textcnn_pheme.pt
      - models/vocab_pheme.pkl
    metrics:
      - metrics/pheme_baselines.json:
          cache: false

  # Replaces the old train_bertweet stage.
  # Runs on GPU (Vast.ai) via train_vastai.sh — not intended for local dvc repro.
  # Steps inside: (1) PHEME-only fine-tune, (2) pseudo-label live tweets,
  #               (3) PHEME+pseudo fine-tune, (4) side-by-side comparison.
  compare_retraining:
    cmd: python src/compare_retraining.py
    deps:
      - data/processed/pheme_cleaned.csv
      - data/new_scraped/
      - src/compare_retraining.py
    params:
      - bertweet.model_name
      - bertweet.max_len
      - bertweet.batch_size
      - bertweet.epochs
      - bertweet.learning_rate
      - bertweet.warmup_ratio
      - bertweet.weight_decay
      - bertweet.test_size
      - bertweet.random_state
    outs:
      - models/bertweet_pheme_only/
      - models/bertweet_augmented/
      - models/bertweet_finetuned/
      - data/processed/pheme_augmented.csv
    metrics:
      - metrics/bertweet_pheme_only.json:
          cache: false
      - metrics/bertweet_augmented.json:
          cache: false
      - metrics/retraining_comparison.json:
          cache: false
      - metrics/pseudo_label_stats.json:
          cache: false
      - metrics/augmented_dataset_metadata.json:
          cache: false

  drift_analysis:
    cmd: python src/drift_analysis.py
    deps:
      - models/bertweet_finetuned/
      - data/processed/pheme_cleaned.csv
      - data/new_scraped/
      - src/drift_analysis.py
    metrics:
      - metrics/drift_analysis.json:
          cache: false
