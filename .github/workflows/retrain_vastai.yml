name: Retrain on Vast.ai

on:
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v3

      - name: Install Vast.ai CLI
        run: pip install vastai

      - name: Authenticate Vast.ai
        run: vastai set api-key ${{ secrets.VASTAI_API_KEY }}

      - name: Destroy any leftover instances from previous runs
        run: |
          INSTANCES=$(vastai show instances --raw 2>/dev/null || echo "[]")
          echo "$INSTANCES" | python3 -c "
          import sys, json, subprocess
          instances = json.load(sys.stdin)
          if not instances:
              print('No existing instances to clean up.')
              sys.exit(0)
          for inst in instances:
              iid = inst.get('id')
              status = inst.get('actual_status', 'unknown')
              print(f'Destroying leftover instance {iid} (status={status})...')
              subprocess.run(['vastai', 'destroy', 'instance', str(iid)], check=False)
          print('Cleanup done.')
          " || echo "Cleanup step skipped."

      - name: Find cheapest offer and launch instance (with retry)
        id: instance
        run: |
          INSTANCE_ID=""
          for attempt in 1 2 3; do
            echo "Attempt $attempt: searching for GPU offer..."

            # Try RTX 3090 first, fall back to RTX 4090
            # Minimum $0.40/hr filters out unreliable cheap hosts
            # Reliability >= 0.95 for stable instances
            OFFER_ID=""
            for GPU in RTX_3090 RTX_4090; do
              echo "  Trying $GPU..."
              OFFER_ID=$(vastai search offers \
                "reliability >= 0.95 num_gpus >= 1 gpu_name = $GPU disk_space >= 20 cuda_vers >= 11.8 dph_total >= 0.40 dph_total <= 2.50" \
                --type on-demand --raw \
                | python3 -c "
          import sys, json
          offers = json.load(sys.stdin)
          if not offers:
              sys.exit(1)
          offers.sort(key=lambda x: x['dph_total'])
          best = offers[0]
          print(f'  price=\${best[\"dph_total\"]:.3f}/hr  reliability={best[\"reliability2\"]:.2f}', file=sys.stderr)
          print(best['id'])
          " 2>/dev/null || echo "")
              if [ -n "$OFFER_ID" ]; then
                echo "  Found $GPU offer: $OFFER_ID"
                break
              fi
            done

            if [ -z "$OFFER_ID" ]; then
              echo "No RTX 3090 or RTX 4090 offers found. Retrying in 15s..."
              sleep 15
              continue
            fi
            echo "Trying offer: $OFFER_ID"

            RAW=$(vastai create instance "$OFFER_ID" \
              --image pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime \
              --disk 30 \
              --raw \
              --onstart-cmd "bash -c 'curl -fsSL https://raw.githubusercontent.com/zegdane1998/fake-news-mlops/master/train_vastai.sh -o /root/train_vastai.sh && bash /root/train_vastai.sh ${{ secrets.GH_PAT }} > /root/train.log 2>&1'")

            echo "Raw response: $RAW"

            if [ -z "$RAW" ]; then
              echo "Empty response (offer likely taken). Retrying in 15s..."
              sleep 15
              continue
            fi

            INSTANCE_ID=$(echo "$RAW" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data['new_contract'] if data.get('success') else '')
          " 2>/dev/null || echo "")

            if [ -n "$INSTANCE_ID" ]; then
              echo "Instance $INSTANCE_ID launched on offer $OFFER_ID"
              break
            fi

            echo "Create returned no instance ID. Retrying in 15s..."
            sleep 15
          done

          if [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: Failed to launch instance after 3 attempts."
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Verify instance is running
        run: |
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          echo "Waiting for instance $INSTANCE_ID to reach 'running' status (up to 30 min)..."
          for check in $(seq 1 60); do
            sleep 30
            RAW=$(vastai show instance "$INSTANCE_ID" --raw 2>/dev/null || echo "[]")
            STATUS=$(echo "$RAW" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          inst = d[0] if isinstance(d, list) else d
          print(inst.get('actual_status', 'unknown'))
          " 2>/dev/null || echo "unknown")
            MSG=$(echo "$RAW" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          inst = d[0] if isinstance(d, list) else d
          print(inst.get('status_msg', '')[:80])
          " 2>/dev/null || echo "")
            echo "[$check/60] status=$STATUS  $MSG"
            if [ "$STATUS" = "running" ]; then
              echo "Instance is running."
              exit 0
            fi
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "destroyed" ]; then
              echo "ERROR: Instance terminated unexpectedly (status=$STATUS)."
              exit 1
            fi
          done
          echo "ERROR: Instance never reached running state after 30 min — destroying."
          vastai destroy instance "$INSTANCE_ID" || true
          exit 1

      - name: Wait for training to finish
        run: |
          BEFORE_SHA="${{ github.sha }}"
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          echo "BEFORE_SHA=$BEFORE_SHA"
          echo "Polling every 2 min for training status commit (up to 120 min)..."
          for i in $(seq 1 60); do
            sleep 120
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/zegdane1998/fake-news-mlops/commits/master")
            LATEST_SHA=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
            LATEST_MSG=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['commit']['message'])")
            echo "[$i/60] $LATEST_MSG"
            if [ "$LATEST_SHA" = "$BEFORE_SHA" ]; then
              continue
            fi
            if echo "$LATEST_MSG" | grep -qi "FAILED"; then
              echo "ERROR: Training script reported failure: $LATEST_MSG"
              exit 1
            fi
            if echo "$LATEST_MSG" | grep -qi "fine-tuned on PHEME"; then
              echo "Training complete!"
              exit 0
            fi
          done
          echo "ERROR: Training did not complete within 120 minutes" && exit 1

      - name: Destroy instance
        if: always()
        run: |
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          if [ -z "$INSTANCE_ID" ]; then
            echo "No instance to destroy."
            exit 0
          fi
          curl -s -X DELETE "https://console.vast.ai/api/v0/instances/$INSTANCE_ID/" \
            -H "Authorization: Bearer ${{ secrets.VASTAI_API_KEY }}"
          echo "Instance $INSTANCE_ID destroyed."
